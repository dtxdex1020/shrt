name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shrt .
      - name: Smoke test the image
        run: |
          docker run -d --name shrt -p 3000:3000 shrt
          for i in $(seq 1 20); do curl -fs localhost:3000/healthz && break; sleep 1; done
          curl -fs -X POST localhost:3000/api/links -H 'content-type: application/json' \
            -d '{"url":"https://example.com","slug":"smoke"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/smoke)" = 302
          docker logs shrt
